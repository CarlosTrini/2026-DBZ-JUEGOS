<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Base Sphere Gradient -->
    <radialGradient id="sphereGrad" cx="38%" cy="32%" r="68%">
      <stop offset="0%" stop-color="#fff885"/>
      <stop offset="18%" stop-color="#ffbe1a"/>
      <stop offset="55%" stop-color="#ff7a00"/>
      <stop offset="82%" stop-color="#d63800"/>
      <stop offset="100%" stop-color="#700f00"/>
    </radialGradient>

    <!-- Outer Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe680" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#e65100" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3e0700" stop-opacity="0.9"/>
    </linearGradient>

    <!-- 1 Star Gradient -->
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="45%" stop-color="#d31010"/>
      <stop offset="100%" stop-color="#8a0000"/>
    </linearGradient>

    <!-- Star Glow / Inner Shadow Filter -->
    <filter id="starDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#4d0500" flood-opacity="0.6"/>
    </filter>

    <!-- Top Highlight Gradient -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Bottom Secondary Glow Gradient -->
    <radialGradient id="bottomGlow" cx="60%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#ff9900" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ff3700" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sphere Shadow -->
  <ellipse cx="64" cy="118" rx="46" ry="7" fill="#000000" opacity="0.35" filter="blur(4px)"/>

  <!-- Main Dragon Ball Sphere -->
  <circle cx="64" cy="64" r="56" fill="url(#sphereGrad)" stroke="url(#rimGrad)" stroke-width="2.5"/>

  <!-- Bottom Inner Glow -->
  <circle cx="64" cy="64" r="55" fill="url(#bottomGlow)" style="mix-blend-mode: screen;"/>

  <!-- Center 1-Star (Dragon Ball Z crimson star) -->
  <g filter="url(#starDepth)">
    <polygon 
      points="64,41.5 69.8,55.8 85.2,56.6 73.3,66.2 77.4,81.1 64.0,72.7 50.6,81.1 54.7,66.2 42.8,56.6 58.2,55.8" 
      fill="url(#starGrad)"
      stroke="#ff6b6b"
      stroke-width="0.75"
      stroke-linejoin="round"
    />
  </g>

  <!-- Top-Left Glass Reflection / Specular Arc -->
  <ellipse cx="48" cy="34" rx="26" ry="14" transform="rotate(-32 48 34)" fill="url(#highlightGrad)"/>

  <!-- Crisp Point Highlight -->
  <ellipse cx="36" cy="27" rx="7" ry="3.5" transform="rotate(-35 36 27)" fill="#ffffff" opacity="0.9"/>
  <circle cx="28" cy="36" r="2" fill="#ffffff" opacity="0.7"/>
</svg>